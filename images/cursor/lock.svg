  <g stroke="#C8913F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M16 8.5V12.5M16 19.5V23.5M8.5 16H12.5M19.5 16H23.5"/>
    <path d="M4 9.5V4H9.5M22.5 4H28V9.5M28 22.5V28H22.5M9.5 28H4V22.5"/>
