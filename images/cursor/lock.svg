<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- 누를 수 있는 곳: "조준 고정". 십자선이 안쪽으로 좁혀지고 네 모서리에 괄호가 생긴다. 색 = 앰버 #C8913F. 클릭 지점 = 정중앙 (16,16) -->
  <!-- 어두운 바깥선 -->
  <g stroke="#0B0C10" stroke-opacity=".75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M16 8.5V12.5M16 19.5V23.5M8.5 16H12.5M19.5 16H23.5"/>
    <path d="M4 9.5V4H9.5M22.5 4H28V9.5M28 22.5V28H22.5M9.5 28H4V22.5"/>
